<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../css/style_registro.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">



</head>

<body>

    <header class="video">
        <video autoplay loop muted playsinline class="bg-video">
            <source src="video_registro.mp4" type="video/mp4">
            <source src="video_registro.mp4" type="video/webm">
        </video>

        <div class="container">
            <div class="row">
                <div class="col-md-6">

                    <h3 class="titulos text-center"> Registrate! </h3>

                    <div class="formulario">
                        <form class="form">
                            <div class="mb-3">
                                <label for="nombreUser" class="form-label"> Nombre de Usuario </label>
                                <input type="text" class="form-control w-150" id="nombreUser"
                                    aria-describedby="emailHelp">
                            </div>

                            <div class="mb-3">
                                <label for="edad" class="form-label"> Edad </label>
                                <input type="number" class="form-control w-150" id="edad" aria-describedby="emailHelp">
                            </div>

                            <div class="input-group mb-3 w-80">
                                <label class="input-group-text" for="inputGroupSelect01">Genero</label>
                                <select class="form-select" id="genero">
                                    <option selected></option>
                                    <option value="1">Femenino</option>
                                    <option value="2">Masculino</option>
                                    <option value="3">Otro</option>
                                </select>
                            </div>


                            <div class="mb-3">
                                <label for="exampleInputEmail1" class="form-label"> Correo Electronico </label>
                                <input type="email" class="form-control w-150" id="exampleInputEmail1"
                                    aria-describedby="emailHelp">
                                <div id="emailHelp" class="form-text">No compartas este dato con nadie mas</div>
                            </div>

                            <div class="mb-3">
                                <label for="exampleInputPassword1" class="form-label">Contraseña</label>
                                <input type="password" class="form-control w-150" id="password">
                                <div id="passwordHelp" class="form-text">No compartas este dato con nadie mas</div>
                            </div>
                            <div class="mb-3 form-check">
                                <input type="checkbox" class="form-check-input" id="exampleCheck1"
                                    style="width: 20px; height: 20px; padding-top: 10px;">
                                <label class="form-check-label" for="exampleCheck1"
                                    style="padding-left: 10px; font-size: 20px;">Terminos y Condiciones</label>
                            </div>
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                                class="bi bi-facebook" viewBox="0 0 16 16" style="color: aliceblue;">
                                <path
                                   
                                d="M16 8.049c0-4.446-3.582-8.05-8-8.05C3.58 0-.002 3.603-.002 8.05c0 4.017 2.926 7.347 6.75 7.951v-5.625h-2.03V8.05H6.75V6.275c0-2.017 1.195-3.131 3.022-3.131.876 0 1.791.157 1.791.157v1.98h-1.009c-.993 0-1.303.621-1.303 1.258v1.51h2.218l-.354 2.326H9.25V16c3.824-.604 6.75-3.934 6.75-7.951" />
                            </svg>
                            <a href="index_inicioSesion.html" target="_self">
                                <button type="submit" class="btn-registro"
                                    style="background-color: rgb(35, 35, 141); color: rgb(255, 255, 255);">Registrame</button>
                            </a>
                        </form>
                    </div>
                </div>
            </div>
    </header>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
        crossorigin="anonymous"></script>
</body>

</html>
